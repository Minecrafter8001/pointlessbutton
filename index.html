<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="6c922f00-14f0-42b7-978e-5ca336a32597"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointless Button</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1e1e1e;
            color: white;
        }

        button {
            width: 100px;
            height: 100px;
            font-size: 16px;
            background-color: lightblue;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
    <body>
        <button id="pointlessButton">Click me!</button>
        <script>
            document.getElementById("pointlessButton").addEventListener("click", () => {
                if (window.umami && umami.track) {
                    umami.track("button_press");
                } else {
                    console.warn("Umami not loaded yet");
                }
            });
        </script>
    </body>
</html>
