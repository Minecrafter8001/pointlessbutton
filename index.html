    <meta charset="UTF-8">

    <title>Pointless Button</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1e1e1e;
            color: white;
        }

        button {
            width: 100px;
            height: 100px;
            font-size: 16px;
            background-color: lightblue;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>

<body>
    <button onclick="">Click me!</button>
